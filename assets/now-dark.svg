<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" fill="none">
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,"Helvetica Neue",Arial,sans-serif}
    .in{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
    .d1{animation-delay:.05s}.d2{animation-delay:.2s}
    .ping{transform-box:fill-box;transform-origin:center;animation:ping 2.4s cubic-bezier(0,0,.2,1) infinite}
    .draw{stroke-dasharray:340;animation:draw 1.8s .5s cubic-bezier(.4,0,.2,1) both}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    @keyframes ping{0%{transform:scale(1);opacity:.7}80%,100%{transform:scale(3.2);opacity:0}}
    @keyframes draw{from{stroke-dashoffset:340}to{stroke-dashoffset:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <!-- ───────── Card 1 · Modern CRM ───────── -->
  <g class="in d1">
    <rect x=".5" y=".5" width="587" height="339" rx="20" fill="#0B0B0C" stroke="#FFFFFF" stroke-opacity=".08"/>

    <rect x="40.5" y="40.5" width="44" height="44" rx="12" fill="#141416" stroke="#FFFFFF" stroke-opacity=".12"/>
    <rect x="52" y="64" width="5" height="10" rx="2.5" fill="#FFFFFF" fill-opacity=".35"/>
    <rect x="60" y="57" width="5" height="17" rx="2.5" fill="#FFFFFF" fill-opacity=".6"/>
    <rect x="68" y="50" width="5" height="24" rx="2.5" fill="#4D8BFF"/>

    <rect x="398.5" y="48.5" width="150" height="28" rx="14" fill="#4D8BFF" fill-opacity=".1" stroke="#4D8BFF" stroke-opacity=".35"/>
    <circle cx="415" cy="62.5" r="3.5" fill="#4D8BFF" class="ping"/>
    <circle cx="415" cy="62.5" r="3.5" fill="#4D8BFF"/>
    <text x="427" y="66.5" class="mono" font-size="11" letter-spacing="1.5" fill="#4D8BFF">IN DEVELOPMENT</text>

    <text x="40" y="130" class="sans" font-size="30" font-weight="700" letter-spacing="-.8" fill="#F5F5F5">Modern CRM</text>
    <text x="40" y="164" class="sans" font-size="16" fill="#A1A1AA">A CRM I actually want to use myself. Quick to</text>
    <text x="40" y="188" class="sans" font-size="16" fill="#A1A1AA">click through, no bloat, automations that make sense.</text>

    <text x="40" y="236" class="mono" font-size="11" letter-spacing="1.8" fill="#71717A">ROADMAP</text>
    <line x1="46" y1="262" x2="542" y2="262" stroke="#FFFFFF" stroke-opacity=".1" stroke-width="2"/>
    <line x1="46" y1="262" x2="378" y2="262" stroke="#4D8BFF" stroke-width="2" class="draw"/>
    <circle cx="46" cy="262" r="6" fill="#4D8BFF"/>
    <circle cx="212" cy="262" r="6" fill="#4D8BFF"/>
    <circle cx="378" cy="262" r="6" fill="#4D8BFF" class="ping"/>
    <circle cx="378" cy="262" r="6" fill="#4D8BFF"/>
    <circle cx="378" cy="262" r="2.5" fill="#0B0B0C"/>
    <circle cx="542" cy="262" r="5.5" fill="#0B0B0C" stroke="#FFFFFF" stroke-opacity=".25"/>
    <text x="40" y="296" class="mono" font-size="11" letter-spacing="1.5" fill="#A1A1AA">IDEA</text>
    <text x="212" y="296" class="mono" font-size="11" letter-spacing="1.5" fill="#A1A1AA" text-anchor="middle">DESIGN</text>
    <text x="378" y="296" class="mono" font-size="11" letter-spacing="1.5" fill="#F5F5F5" text-anchor="middle">BUILD</text>
    <text x="548" y="296" class="mono" font-size="11" letter-spacing="1.5" fill="#71717A" text-anchor="end">LAUNCH</text>
  </g>

  <!-- ───────── Card 2 · Small tools ───────── -->
  <g class="in d2">
    <rect x="612.5" y=".5" width="587" height="339" rx="20" fill="#0B0B0C" stroke="#FFFFFF" stroke-opacity=".08"/>

    <rect x="652.5" y="40.5" width="44" height="44" rx="12" fill="#141416" stroke="#FFFFFF" stroke-opacity=".12"/>
    <rect x="663" y="51" width="9" height="9" rx="2.5" fill="#4D8BFF"/>
    <rect x="676" y="51" width="9" height="9" rx="2.5" fill="#FFFFFF" fill-opacity=".6"/>
    <rect x="663" y="64" width="9" height="9" rx="2.5" fill="#FFFFFF" fill-opacity=".6"/>
    <rect x="676" y="64" width="9" height="9" rx="2.5" fill="#FFFFFF" fill-opacity=".25"/>

    <rect x="1050.5" y="48.5" width="110" height="28" rx="14" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".14"/>
    <circle cx="1067" cy="62.5" r="3.5" fill="#A1A1AA" class="ping"/>
    <circle cx="1067" cy="62.5" r="3.5" fill="#A1A1AA"/>
    <text x="1079" y="66.5" class="mono" font-size="11" letter-spacing="1.5" fill="#A1A1AA">EXPLORING</text>

    <text x="652" y="130" class="sans" font-size="30" font-weight="700" letter-spacing="-.8" fill="#F5F5F5">Small tools</text>
    <text x="652" y="164" class="sans" font-size="16" fill="#A1A1AA">Little apps and APIs I build when something</text>
    <text x="652" y="188" class="sans" font-size="16" fill="#A1A1AA">annoys me enough. Some of them stick around.</text>

    <text x="652" y="236" class="mono" font-size="11" letter-spacing="1.8" fill="#71717A">FOCUS</text>
    <rect x="652.5" y="250.5" width="92" height="32" rx="16" fill="#141416" stroke="#FFFFFF" stroke-opacity=".1"/>
    <text x="698.5" y="271.5" class="sans" font-size="14" fill="#A1A1AA" text-anchor="middle">Web apps</text>
    <rect x="754.5" y="250.5" width="128" height="32" rx="16" fill="#141416" stroke="#FFFFFF" stroke-opacity=".1"/>
    <text x="818.5" y="271.5" class="sans" font-size="14" fill="#A1A1AA" text-anchor="middle">Internal tools</text>
    <rect x="892.5" y="250.5" width="64" height="32" rx="16" fill="#141416" stroke="#FFFFFF" stroke-opacity=".1"/>
    <text x="924.5" y="271.5" class="sans" font-size="14" fill="#A1A1AA" text-anchor="middle">APIs</text>
    <rect x="966.5" y="250.5" width="108" height="32" rx="16" fill="#141416" stroke="#FFFFFF" stroke-opacity=".1"/>
    <text x="1020.5" y="271.5" class="sans" font-size="14" fill="#A1A1AA" text-anchor="middle">Automation</text>
  </g>
</svg>
