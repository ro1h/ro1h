<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" fill="none">
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,"Helvetica Neue",Arial,sans-serif}
    .in{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    .d1{animation-delay:.05s}.d2{animation-delay:.2s}.d3{animation-delay:.35s}.d4{animation-delay:.5s}
    .ping{transform-box:fill-box;transform-origin:center;animation:ping 2.4s cubic-bezier(0,0,.2,1) infinite}
    .cursor{animation:blink 1.1s steps(1) infinite}
    .spin{transform-origin:1040px 190px;animation:spin 40s linear infinite}
    .spin-r{transform-origin:1040px 190px;animation:spin 26s linear infinite reverse}
    .orbit{transform-origin:1040px 190px;animation:spin 9s linear infinite}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    @keyframes ping{0%{transform:scale(1);opacity:.7}80%,100%{transform:scale(3.4);opacity:0}}
    @keyframes blink{50%{opacity:0}}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>

  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#000000" fill-opacity=".09"/>
    </pattern>
    <radialGradient id="fade" cx="78%" cy="45%" r="70%">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="m"><rect width="1200" height="380" fill="url(#fade)"/></mask>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2563EB" stop-opacity=".12"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="1200" height="380" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="#FAFAF9"/>
    <rect width="1200" height="380" fill="url(#dots)" mask="url(#m)"/>
    <circle cx="1040" cy="190" r="220" fill="url(#glow)"/>

    <!-- mark -->
    <g class="in d2">
      <circle cx="1040" cy="190" r="118" stroke="#000000" stroke-opacity=".10"/>
      <g class="spin"><circle cx="1040" cy="190" r="92" stroke="#000000" stroke-opacity=".28" stroke-dasharray="2 10" stroke-linecap="round" stroke-width="2"/></g>
      <g class="spin-r"><path d="M1040 124a66 66 0 0 1 66 66" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/><circle cx="1040" cy="190" r="66" stroke="#000000" stroke-opacity=".12"/></g>
      <rect x="1018" y="168" width="44" height="44" rx="12" fill="#151517" stroke="#000000" stroke-opacity=".14"/>
      <path d="M1032 198v-16h9a5 5 0 0 1 0 10h-9m9 0 6 6" stroke="#0A0A0A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <g class="orbit"><circle cx="1040" cy="72" r="4.5" fill="#2563EB"/></g>
    </g>

    <!-- status -->
    <g class="in d1">
      <circle cx="78" cy="86" r="4" fill="#2563EB" class="ping"/>
      <circle cx="78" cy="86" r="4" fill="#2563EB"/>
      <text x="94" y="91" class="mono" font-size="13" letter-spacing="2.2" fill="#52525B">CURRENTLY BUILDING A CRM</text>
    </g>

    <!-- name -->
    <text x="68" y="214" class="sans in d2" font-size="124" font-weight="700" letter-spacing="-6" fill="#0A0A0A">Rowan<tspan fill="#2563EB">.</tspan></text>

    <!-- tagline -->
    <text x="74" y="262" class="sans in d3" font-size="24" fill="#52525B">Full-stack dev. I build <tspan fill="#0A0A0A">web apps, SaaS things</tspan> and the tools behind them.</text>

    <!-- meta -->
    <g class="in d4">
      <text x="74" y="318" class="mono" font-size="13" letter-spacing="1.4" fill="#A1A1AA">WEB APPS <tspan fill="#2563EB">/</tspan> SAAS <tspan fill="#2563EB">/</tspan> AUTOMATION <tspan fill="#2563EB">/</tspan> NL <tspan fill="#2563EB" class="cursor">▌</tspan></text>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="379" rx="23.5" stroke="#000000" stroke-opacity=".08"/>
</svg>
