<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" fill="none">
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,"Helvetica Neue",Arial,sans-serif}
    .fade{animation:fade 1.2s ease both}
    .spin{transform-origin:1040px 140px;animation:spin 60s linear infinite}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs><clipPath id="card"><rect width="1200" height="280" rx="20"/></clipPath></defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="280" fill="#08101F"/>

    <g class="fade">
      <text x="64" y="158" class="sans" font-size="120" font-weight="700" letter-spacing="-5" fill="#EEF2FA">Rowan<tspan fill="#4D8BFF">.</tspan></text>
      <text x="70" y="210" class="sans" font-size="24" fill="#8B9BB8">Full-stack developer from the Netherlands.</text>
    </g>

    <g class="fade" style="animation-delay:.2s">
      <circle cx="1040" cy="140" r="96" stroke="#1E2A45" stroke-width="1.5"/>
      <g class="spin">
        <circle cx="1040" cy="140" r="72" stroke="#2A3A5E" stroke-width="1.5" stroke-dasharray="3 9" stroke-linecap="round"/>
        <path d="M1040 68a72 72 0 0 1 72 72" stroke="#4D8BFF" stroke-width="2.5" stroke-linecap="round"/>
      </g>
      <rect x="1016.5" y="116.5" width="47" height="47" rx="12" fill="#0F1A30" stroke="#1E2A45"/>
      <path d="M1031 150v-19h10a5.5 5.5 0 0 1 0 11h-10m10 0 7 8" stroke="#EEF2FA" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="1055" cy="150" r="2.6" fill="#4D8BFF"/>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="279" rx="19.5" stroke="#FFFFFF" stroke-opacity=".08"/>
</svg>
