<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" fill="none">
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
    .code{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:17px;white-space:pre}
    .ln{fill:#D4D4D8;font-size:14px}
    .k{fill:#2563EB}.p{fill:#0A0A0A}.s{fill:#1D4ED8}.u{fill:#A1A1AA}.t{fill:#0E7490}.c{fill:#A1A1AA;font-style:italic}
    .l{animation:type .5s ease-out both}
    .cursor{animation:blink 1.1s steps(1) infinite}
    @keyframes type{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs><clipPath id="w"><rect width="1200" height="470" rx="20"/></clipPath></defs>

  <g clip-path="url(#w)">
    <rect width="1200" height="470" fill="#FAFAF9"/>
    <!-- title bar -->
    <rect width="1200" height="52" fill="#FFFFFF"/>
    <line x1="0" y1="52.5" x2="1200" y2="52.5" stroke="#000000" stroke-opacity=".08"/>
    <circle cx="28" cy="26" r="6" fill="#000000" fill-opacity=".14"/>
    <circle cx="48" cy="26" r="6" fill="#000000" fill-opacity=".14"/>
    <circle cx="68" cy="26" r="6" fill="#2563EB"/>
    <rect x="96" y="10" width="200" height="43" rx="10" fill="#FAFAF9"/>
    <rect x="96" y="44" width="200" height="9" fill="#FAFAF9"/>
    <rect x="112" y="24" width="10" height="10" rx="2.5" fill="#2563EB"/>
    <text x="132" y="34" class="mono" font-size="13" fill="#0A0A0A">rowan.config.ts</text>
    <text x="1172" y="31" class="mono" font-size="11" letter-spacing="1.5" fill="#A1A1AA" text-anchor="end">TYPESCRIPT · UTF-8 · LF</text>

    <!-- minimap -->
    <g fill="#000000" fill-opacity=".07">
      <rect x="1112" y="84" width="36" height="3" rx="1.5"/><rect x="1112" y="96" width="44" height="3" rx="1.5"/>
      <rect x="1118" y="108" width="40" height="3" rx="1.5"/><rect x="1118" y="120" width="34" height="3" rx="1.5"/>
      <rect x="1118" y="132" width="56" height="3" rx="1.5"/><rect x="1118" y="144" width="42" height="3" rx="1.5"/>
      <rect x="1118" y="156" width="48" height="3" rx="1.5"/><rect x="1118" y="168" width="44" height="3" rx="1.5"/>
      <rect x="1118" y="180" width="32" height="3" rx="1.5"/><rect x="1118" y="192" width="56" height="3" rx="1.5"/>
      <rect x="1112" y="204" width="30" height="3" rx="1.5"/>
    </g>
    <rect x="1104" y="76" width="76" height="140" rx="4" fill="#2563EB" fill-opacity=".06" stroke="#2563EB" stroke-opacity=".2"/>

    <!-- line highlight -->
    <rect x="0" y="351" width="1090" height="30" fill="#2563EB" fill-opacity=".07"/>
    <rect x="0" y="351" width="2" height="30" fill="#2563EB"/>

    <!-- line numbers -->
    <g class="mono ln" text-anchor="end">
      <text x="52" y="100">1</text><text x="52" y="130">2</text><text x="52" y="160">3</text>
      <text x="52" y="190">4</text><text x="52" y="220">5</text><text x="52" y="250">6</text>
      <text x="52" y="280">7</text><text x="52" y="310">8</text><text x="52" y="340">9</text>
      <text x="52" y="370" fill="#52525B">10</text><text x="52" y="400">11</text><text x="52" y="430">12</text>
    </g>

    <!-- code -->
    <text x="80" y="100" class="code c l" style="animation-delay:.10s" xml:space="preserve">// hi, I'm Rowan. nice to meet you.</text>
    <text x="80" y="130" class="code l" style="animation-delay:.20s" xml:space="preserve"><tspan class="k">export const</tspan><tspan class="p"> rowan </tspan><tspan class="u">= {</tspan></text>
    <text x="80" y="160" class="code l" style="animation-delay:.30s" xml:space="preserve"><tspan class="p">  role</tspan><tspan class="u">: </tspan><tspan class="s">"Full-stack developer"</tspan><tspan class="u">,</tspan></text>
    <text x="80" y="190" class="code l" style="animation-delay:.40s" xml:space="preserve"><tspan class="p">  based</tspan><tspan class="u">: </tspan><tspan class="s">"the Netherlands"</tspan><tspan class="u">,</tspan></text>
    <text x="80" y="220" class="code l" style="animation-delay:.50s" xml:space="preserve"><tspan class="p">  languages</tspan><tspan class="u">: [</tspan><tspan class="s">"TypeScript"</tspan><tspan class="u">, </tspan><tspan class="s">"JavaScript"</tspan><tspan class="u">, </tspan><tspan class="s">"PHP"</tspan><tspan class="u">, </tspan><tspan class="s">"Python"</tspan><tspan class="u">],</tspan></text>
    <text x="80" y="250" class="code l" style="animation-delay:.60s" xml:space="preserve"><tspan class="p">  frontend</tspan><tspan class="u">: [</tspan><tspan class="s">"React"</tspan><tspan class="u">, </tspan><tspan class="s">"Tailwind CSS"</tspan><tspan class="u">],</tspan></text>
    <text x="80" y="280" class="code l" style="animation-delay:.70s" xml:space="preserve"><tspan class="p">  backend</tspan><tspan class="u">: [</tspan><tspan class="s">"Node.js"</tspan><tspan class="u">, </tspan><tspan class="s">"MySQL"</tspan><tspan class="u">, </tspan><tspan class="s">"REST APIs"</tspan><tspan class="u">],</tspan></text>
    <text x="80" y="310" class="code l" style="animation-delay:.80s" xml:space="preserve"><tspan class="p">  shipping</tspan><tspan class="u">: [</tspan><tspan class="s">"Docker"</tspan><tspan class="u">, </tspan><tspan class="s">"Vercel"</tspan><tspan class="u">, </tspan><tspan class="s">"Git"</tspan><tspan class="u">],</tspan></text>
    <text x="80" y="340" class="code l" style="animation-delay:.90s" xml:space="preserve"><tspan class="p">  building</tspan><tspan class="u">: </tspan><tspan class="s">"a modern CRM"</tspan><tspan class="u">,</tspan></text>
    <text x="80" y="370" class="code l" style="animation-delay:1.0s" xml:space="preserve"><tspan class="p">  motto</tspan><tspan class="u">: </tspan><tspan class="s">"make it work → make it useful → make it better"</tspan><tspan class="u">,</tspan></text>
    <text x="80" y="400" class="code l" style="animation-delay:1.1s" xml:space="preserve"><tspan class="u">} </tspan><tspan class="k">satisfies</tspan><tspan class="t"> Developer</tspan><tspan class="u">;</tspan><tspan class="k cursor"> ▌</tspan></text>

    <!-- status bar -->
    <rect y="440" width="1200" height="30" fill="#FFFFFF"/>
    <line x1="0" y1="439.5" x2="1200" y2="439.5" stroke="#000000" stroke-opacity=".08"/>
    <circle cx="28" cy="455" r="3.5" fill="#2563EB"/>
    <text x="40" y="459" class="mono" font-size="11" letter-spacing="1.2" fill="#52525B">main</text>
    <text x="96" y="459" class="mono" font-size="11" letter-spacing="1.2" fill="#A1A1AA">✓ 0 problems</text>
    <text x="1172" y="459" class="mono" font-size="11" letter-spacing="1.2" fill="#A1A1AA" text-anchor="end">Ln 11, Col 24   Spaces: 2</text>
  </g>
  <rect x=".5" y=".5" width="1199" height="469" rx="19.5" stroke="#000000" stroke-opacity=".08"/>
</svg>
