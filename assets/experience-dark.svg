<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="576" viewBox="0 0 1200 576" fill="none">
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,"Helvetica Neue",Arial,sans-serif}
.in{animation:fade .9s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g class="in" style="animation-delay:0.00s"><rect x="0.5" y="0.5" width="587" height="175" rx="16" fill="#08101F" stroke="#1E2A45"/><text x="32" y="52" class="sans" font-size="24" font-weight="700" letter-spacing="-.4" fill="#EEF2FA">FiveM &amp; GTA RP</text><text x="32" y="86" class="sans" font-size="16" fill="#8B9BB8">Scripts and systems for GTA roleplay servers in Lua and TS.</text><text x="32" y="110" class="sans" font-size="16" fill="#8B9BB8">Worked on custom frameworks together with other developers.</text><text x="32" y="146" class="sans" font-size="14.5" fill="#6B7B99">Lua, TypeScript, NUI, server scripts</text></g><g class="in" style="animation-delay:0.08s"><rect x="612.5" y="0.5" width="587" height="175" rx="16" fill="#08101F" stroke="#1E2A45"/><text x="644" y="52" class="sans" font-size="24" font-weight="700" letter-spacing="-.4" fill="#EEF2FA">Discord bots</text><text x="644" y="86" class="sans" font-size="16" fill="#8B9BB8">Moderation, tickets, staff applications and a 24/7 radio bot.</text><text x="644" y="110" class="sans" font-size="16" fill="#8B9BB8">Plus Vexo, a bot platform with its own live dashboard.</text><text x="644" y="146" class="sans" font-size="14.5" fill="#6B7B99">Discord.js, slash commands, dashboards</text></g><g class="in" style="animation-delay:0.16s"><rect x="0.5" y="200.5" width="587" height="175" rx="16" fill="#08101F" stroke="#1E2A45"/><text x="32" y="252" class="sans" font-size="24" font-weight="700" letter-spacing="-.4" fill="#EEF2FA">SaaS &amp; web apps</text><text x="32" y="286" class="sans" font-size="16" fill="#8B9BB8">Asyqa and HoloAtlas are live, the Asyqa CRM is next.</text><text x="32" y="310" class="sans" font-size="16" fill="#8B9BB8">Auth, 2FA, passkeys, roles, billing and realtime chat.</text><text x="32" y="346" class="sans" font-size="14.5" fill="#6B7B99">Next.js, Supabase, MongoDB, Prisma</text></g><g class="in" style="animation-delay:0.24s"><rect x="612.5" y="200.5" width="587" height="175" rx="16" fill="#08101F" stroke="#1E2A45"/><text x="644" y="252" class="sans" font-size="24" font-weight="700" letter-spacing="-.4" fill="#EEF2FA">Websites</text><text x="644" y="286" class="sans" font-size="16" fill="#8B9BB8">Business and community sites with their own admin panel.</text><text x="644" y="310" class="sans" font-size="16" fill="#8B9BB8">Accounts, uploads, backups and PWA support included.</text><text x="644" y="346" class="sans" font-size="14.5" fill="#6B7B99">Admin panels, Netlify, Vercel, PWA</text></g><g class="in" style="animation-delay:0.32s"><rect x="0.5" y="400.5" width="1199" height="175" rx="16" fill="#08101F" stroke="#1E2A45"/><text x="32" y="452" class="sans" font-size="24" font-weight="700" letter-spacing="-.4" fill="#EEF2FA">Tools &amp; apps</text><text x="32" y="486" class="sans" font-size="16" fill="#8B9BB8">An OBS control room with overlays, alerts and a Twitch chatbot.</text><text x="32" y="510" class="sans" font-size="16" fill="#8B9BB8">Plus a remote-support app for Windows and a repo health CLI.</text><text x="32" y="546" class="sans" font-size="14.5" fill="#6B7B99">OBS, overlays, desktop app, CLI</text></g>
</svg>
