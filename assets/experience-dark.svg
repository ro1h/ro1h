" letter-spacing="-.5" fill="#EEF2FA">SaaS &amp; web apps</text><text x="32" y="402" class="sans" font-size="14.5" fill="#8B9BB8">Asyqa, a CRM for 18 industries, and a link-in-bio platform.</text><text x="32" y="423" class="sans" font-size="14.5" fill="#8B9BB8">Auth, 2FA, passkeys, roles, billing and realtime chat.</text><rect x="32.5" y="446.5" width="75" height="26" rx="8" fill="#0F1A30" stroke="#1E2A45"/><text x="69.5" y="463.5" class="mono" font-size="11.5" fill="#B4C2DC" text-anchor="middle">Next.js</text><rect x="115.5" y="446.5" width="82" height="26" rx="8" fill="#0F1A30" stroke="#1E2A45"/><text x="156" y="463.5" class="mono" font-size="11.5" fill="#B4C2DC" text-anchor="middle">Supabase</text><rect x="205.5" y="446.5" width="75" height="26" rx="8" fill="#0F1A30" stroke="#1E2A45"/><text x="242.5" y="463.5" class="mono" font-size="11.5" fill="#B4C2DC" text-anchor="middle">MongoDB</text><rect x="288.5" y="446.5" width="68" height="26" rx="8" fill="#0F1A30" stroke="#1E2A45"/><text x="322" y="463.5" class="mono" font-size="11.5" fill="#B4C2DC" text-anchor="middle">Prisma</text><rect x="364.5" y="446.5" width="82" height="26" rx="8" fill="#0F1A30" stroke="#1E2A45"/><text x="405" y="463.5" class="mono" font-size="11.5" fill="#B4C2DC" text-anchor="middle">Passkeys</text></g><g class="in" style="animation-delay:0.36s"><rect x="612.5" y="260.5" width="587" height="235" rx="20" fill="#08101F" stroke="#FFFFFF" stroke-opacity=".08"/><rect x="612.5" y="260.5" width="587" height="235" rx="20" fill="url(#cg)"/><line x1="652" y1="260.5" x2="1160" y2="260.5" stroke="url(#sheen)" stroke-width="1.5" class="sh" style="animation-delay:-3.9s"/><rect x="644.5" y="290.5" width="46" height="46" rx="13" fill="#0F1A30" stroke="#1E2A45"/><g transform="translate(655.5 301.5)" stroke="#4D8BFF" color="#4D8BFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 9h18"/><circle cx="6.5" cy="6.5" r=".6" f