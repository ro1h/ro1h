<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" fill="none">
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,"Helvetica Neue",Arial,sans-serif}
    .in{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
    .d1{animation-delay:.05s}.d2{animation-delay:.15s}.d3{animation-delay:.25s}.d4{animation-delay:.35s}
    .ic{stroke:#4D8BFF;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <g class="in d1">
    <rect x=".5" y=".5" width="281" height="219" rx="18" fill="#0B0B0C" stroke="#FFFFFF" stroke-opacity=".08"/>
    <text x="28" y="46" class="mono" font-size="12" letter-spacing="1.5" fill="#71717A">01</text>
    <g transform="translate(232 28)" class="ic"><path d="M2 20 20 2M7 2h13v13"/></g>
    <text x="28" y="124" class="sans" font-size="20" font-weight="700" letter-spacing="-.4" fill="#F5F5F5">Ship, then polish</text>
    <text x="28" y="154" class="sans" font-size="14" fill="#A1A1AA">A rough version that is live</text>
    <text x="28" y="176" class="sans" font-size="14" fill="#A1A1AA">beats a perfect one that isn't.</text>
  </g>

  <g class="in d2">
    <rect x="306.5" y=".5" width="281" height="219" rx="18" fill="#0B0B0C" stroke="#FFFFFF" stroke-opacity=".08"/>
    <text x="334" y="46" class="mono" font-size="12" letter-spacing="1.5" fill="#71717A">02</text>
    <g transform="translate(538 28)" class="ic"><path d="M13 1 3 13h8l-2 9 10-12h-8z"/></g>
    <text x="334" y="124" class="sans" font-size="20" font-weight="700" letter-spacing="-.4" fill="#F5F5F5">Fast or it feels broken</text>
    <text x="334" y="154" class="sans" font-size="14" fill="#A1A1AA">If a page makes me wait,</text>
    <text x="334" y="176" class="sans" font-size="14" fill="#A1A1AA">I'm already annoyed.</text>
  </g>

  <g class="in d3">
    <rect x="612.5" y=".5" width="281" height="219" rx="18" fill="#0B0B0C" stroke="#FFFFFF" stroke-opacity=".08"/>
    <text x="640" y="46" class="mono" font-size="12" letter-spacing="1.5" fill="#71717A">03</text>
    <g transform="translate(844 28)" class="ic"><path d="M3 11a8 8 0 0 1 14-5.3M19 11a8 8 0 0 1-14 5.3M17 1v5h-5M5 21v-5h5"/></g>
    <text x="640" y="124" class="sans" font-size="20" font-weight="700" letter-spacing="-.4" fill="#F5F5F5">Automate the dull stuff</text>
    <text x="640" y="154" class="sans" font-size="14" fill="#A1A1AA">Do it three times and</text>
    <text x="640" y="176" class="sans" font-size="14" fill="#A1A1AA">it gets a script.</text>
  </g>

  <g class="in d4">
    <rect x="918.5" y=".5" width="281" height="219" rx="18" fill="#0B0B0C" stroke="#FFFFFF" stroke-opacity=".08"/>
    <text x="946" y="46" class="mono" font-size="12" letter-spacing="1.5" fill="#71717A">04</text>
    <g transform="translate(1150 28)" class="ic"><path d="M11 1c0 6 4 10 10 10-6 0-10 4-10 10 0-6-4-10-10-10 6 0 10-4 10-10z"/></g>
    <text x="946" y="124" class="sans" font-size="20" font-weight="700" letter-spacing="-.4" fill="#F5F5F5">Readable over clever</text>
    <text x="946" y="154" class="sans" font-size="14" fill="#A1A1AA">Future me has to read</text>
    <text x="946" y="176" class="sans" font-size="14" fill="#A1A1AA">this code too.</text>
  </g>
</svg>
