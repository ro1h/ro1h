<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none">
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,"Helvetica Neue",Arial,sans-serif}
    .in{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
    .d1{animation-delay:.05s}.d2{animation-delay:.2s}
    .marquee{animation:slide 40s linear infinite}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    @keyframes slide{to{transform:translateX(-1200px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <clipPath id="card"><rect width="1200" height="300" rx="24"/></clipPath>
    <radialGradient id="glow" cx="50%" cy="0%" r="60%">
      <stop offset="0" stop-color="#2563EB" stop-opacity=".12"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#000000" fill-opacity=".07"/>
    </pattern>
    <linearGradient id="edge" x1="0" x2="1">
      <stop offset="0" stop-color="#FAFAF9"/><stop offset=".12" stop-color="#FAFAF9" stop-opacity="0"/>
      <stop offset=".88" stop-color="#FAFAF9" stop-opacity="0"/><stop offset="1" stop-color="#FAFAF9"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="#FAFAF9"/>
    <rect width="1200" height="300" fill="url(#dots)"/>
    <rect width="1200" height="300" fill="url(#glow)"/>

    <g class="in d1">
      <text x="600" y="72" class="mono" font-size="12" letter-spacing="2.4" fill="#A1A1AA" text-anchor="middle">SAY HI ↓</text>
    </g>
    <g class="in d2">
      <text x="600" y="140" class="sans" font-size="58" font-weight="700" letter-spacing="-2.4" fill="#52525B" text-anchor="middle">Got an idea?</text>
      <text x="600" y="206" class="sans" font-size="58" font-weight="700" letter-spacing="-2.4" fill="#0A0A0A" text-anchor="middle">Let's make it real<tspan fill="#2563EB">.</tspan></text>
    </g>

    <!-- marquee -->
    <line x1="0" y1="250.5" x2="1200" y2="250.5" stroke="#000000" stroke-opacity=".08"/>
    <g class="marquee mono" font-size="12" letter-spacing="2" fill="#A1A1AA">
      <text x="0" y="280" textLength="1200" lengthAdjust="spacing">WEB APPS  ✦  SAAS  ✦  AUTOMATION  ✦  DASHBOARDS  ✦  APIS  ✦  INTERNAL TOOLS  ✦  CRM  ✦  UX  ✦  </text>
      <text x="1200" y="280" textLength="1200" lengthAdjust="spacing">WEB APPS  ✦  SAAS  ✦  AUTOMATION  ✦  DASHBOARDS  ✦  APIS  ✦  INTERNAL TOOLS  ✦  CRM  ✦  UX  ✦  </text>
    </g>
    <rect y="251" width="1200" height="49" fill="url(#edge)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="299" rx="23.5" stroke="#000000" stroke-opacity=".08"/>
</svg>
