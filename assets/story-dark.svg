<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none">
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,"Helvetica Neue",Arial,sans-serif}
.in{animation:fade .9s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.draw{stroke-dasharray:1100;animation:draw 2s .1s cubic-bezier(.45,0,.2,1) both}
@keyframes draw{from{stroke-dashoffset:1100}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x=".5" y=".5" width="1199" height="299" rx="16" fill="#08101F" stroke="#1E2A45"/><line x1="52" y1="64" x2="904" y2="64" stroke="#4D8BFF" stroke-width="2" class="draw"/><line x1="904" y1="64" x2="1156" y2="64" stroke="#1E2A45" stroke-width="2" stroke-dasharray="4 8"/><g class="in" style="animation-delay:0.20s"><circle cx="52" cy="64" r="7" fill="#08101F" stroke="#4D8BFF" stroke-width="2"/><text x="44" y="126" class="sans" font-size="24" font-weight="700" letter-spacing="-.4" fill="#EEF2FA">It started with FiveM</text><text x="44" y="162" class="sans" font-size="17" fill="#8B9BB8">Lua scripts for GTA roleplay</text><text x="44" y="188" class="sans" font-size="17" fill="#8B9BB8">servers. Break things, fix</text><text x="44" y="214" class="sans" font-size="17" fill="#8B9BB8">them, learn fast.</text></g><g class="in" style="animation-delay:0.60s"><circle cx="336" cy="64" r="7" fill="#08101F" stroke="#4D8BFF" stroke-width="2"/><text x="328" y="126" class="sans" font-size="24" font-weight="700" letter-spacing="-.4" fill="#EEF2FA">Then came the bots</text><text x="328" y="162" class="sans" font-size="17" fill="#8B9BB8">Discord bots for moderation,</text><text x="328" y="188" class="sans" font-size="17" fill="#8B9BB8">tickets and a 24/7 radio.</text><text x="328" y="214" class="sans" font-size="17" fill="#8B9BB8">Communities needed tools.</text></g><g class="in" style="animation-delay:1.00s"><circle cx="620" cy="64" r="7" fill="#08101F" stroke="#4D8BFF" stroke-width="2"/><text x="612" y="126" class="sans" font-size="24" font-weight="700" letter-spacing="-.4" fill="#EEF2FA">Then real websites</text><text x="612" y="162" class="sans" font-size="17" fill="#8B9BB8">Sites with their own admin</text><text x="612" y="188" class="sans" font-size="17" fill="#8B9BB8">panels, for people who just</text><text x="612" y="214" class="sans" font-size="17" fill="#8B9BB8">want it to work.</text></g><g class="in" style="animation-delay:1.40s"><circle cx="904" cy="64" r="8" fill="#4D8BFF"/><text x="896" y="126" class="sans" font-size="24" font-weight="700" letter-spacing="-.4" fill="#EEF2FA">Now: my own products</text><text x="896" y="162" class="sans" font-size="17" fill="#8B9BB8">Asyqa and HoloAtlas are live.</text><text x="896" y="188" class="sans" font-size="17" fill="#8B9BB8">The Asyqa CRM is next.</text><text x="896" y="214" class="sans" font-size="17" fill="#8B9BB8">This is the fun part.</text></g>
</svg>
