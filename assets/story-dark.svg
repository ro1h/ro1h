<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" fill="none">
<style>
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif}
.draw{stroke-dasharray:1000;animation:draw 2.4s .2s cubic-bezier(.45,0,.2,1) both}
.future{animation:fade 1s 2.5s ease both}
.ch{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.2s cubic-bezier(0,0,.2,1) 2.6s infinite}
@keyframes draw{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes ping{0%{transform:scale(1);opacity:.7}80%,100%{transform:scale(3.2);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="prog" x1="0" x2="1"><stop offset="0" stop-color="#2F5FD0"/><stop offset="1" stop-color="#8DB4FF"/></linearGradient>
<radialGradient id="glow" cx="88%" cy="20%" r="55%"><stop offset="0" stop-color="#4D8BFF" stop-opacity=".16"/><stop offset="1" stop-color="#4D8BFF" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#FFFFFF" fill-opacity=".05"/></pattern>
</defs>
<rect width="1200" height="390" rx="20" fill="#08101F"/>
<rect width="1200" height="390" rx="20" fill="url(#dots)"/>
<rect width="1200" height="390" rx="20" fill="url(#glow)"/>
<line x1="72" y1="112" x2="1140" y2="112" stroke="#1E2A45" stroke-width="2"/><line x1="72" y1="112" x2="914" y2="112" stroke="url(#prog)" stroke-width="3" stroke-linecap="round" class="draw"/><line x1="914" y1="112" x2="1140" y2="112" stroke="#4D8BFF" stroke-opacity=".5" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round" class="future"/><g class="ch" style="animation-delay:0.35s"><circle cx="86" cy="112" r="8" fill="#08101F" stroke="#4D8BFF" stroke-width="2.5"/><circle cx="86" cy="112" r="3" fill="#4D8BFF"/><text x="72" y="172" class="mono" font-size="13.5" letter-spacing="2" fill="#5B6B8A">CHAPTER 01</text><text x="72" y="204" class="sans" font-size="24" font-weight="700" letter-spacing="-.5" fill="#EEF2FA">It started with FiveM</text><text x="72" y="242" class="sans" font-size="17" fill="#8B9BB8">Lua scripts for GTA roleplay</text><text x="72" y="268" class="sans" font-size="17" fill="#8B9BB8">servers. Break things, fix</text><text x="72" y="294" class="sans" font-size="17" fill="#8B9BB8">them, learn fast.</text></g><g class="ch" style="animation-delay:0.90s"><circle cx="362" cy="112" r="8" fill="#08101F" stroke="#4D8BFF" stroke-width="2.5"/><circle cx="362" cy="112" r="3" fill="#4D8BFF"/><text x="348" y="172" class="mono" font-size="13.5" letter-spacing="2" fill="#5B6B8A">CHAPTER 02</text><text x="348" y="204" class="sans" font-size="24" font-weight="700" letter-spacing="-.5" fill="#EEF2FA">Then came the bots</text><text x="348" y="242" class="sans" font-size="17" fill="#8B9BB8">Discord bots for moderation,</text><text x="348" y="268" class="sans" font-size="17" fill="#8B9BB8">tickets and a 24/7 radio.</text><text x="348" y="294" class="sans" font-size="17" fill="#8B9BB8">Communities needed tools.</text></g><g class="ch" style="animation-delay:1.45s"><circle cx="638" cy="112" r="8" fill="#08101F" stroke="#4D8BFF" stroke-width="2.5"/><circle cx="638" cy="112" r="3" fill="#4D8BFF"/><text x="624" y="172" class="mono" font-size="13.5" letter-spacing="2" fill="#5B6B8A">CHAPTER 03</text><text x="624" y="204" class="sans" font-size="24" font-weight="700" letter-spacing="-.5" fill="#EEF2FA">Then real websites</text><text x="624" y="242" class="sans" font-size="17" fill="#8B9BB8">Sites with their own admin</text><text x="624" y="268" class="sans" font-size="17" fill="#8B9BB8">panels, for people who just</text><text x="624" y="294" class="sans" font-size="17" fill="#8B9BB8">want it to work.</text></g><g class="ch" style="animation-delay:2.00s"><circle cx="914" cy="112" r="9" fill="#4D8BFF" class="ping"/><circle cx="914" cy="112" r="9" fill="#4D8BFF"/><circle cx="914" cy="112" r="15" stroke="#4D8BFF" stroke-opacity=".35" stroke-width="2"/><rect x="900.5" y="53.5" width="64" height="26" rx="13" fill="#4D8BFF"/><text x="932.5" y="71" class="mono" font-size="11.5" font-weight="700" letter-spacing="2" fill="#06101F" text-anchor="middle">NOW</text><text x="900" y="172" class="mono" font-size="13.5" letter-spacing="2" fill="#8DB4FF">CHAPTER 04</text><text x="900" y="204" class="sans" font-size="24" font-weight="700" letter-spacing="-.5" fill="#EEF2FA">Now: my own products</text><text x="900" y="242" class="sans" font-size="17" fill="#8B9BB8">Asyqa and HoloAtlas are live.</text><text x="900" y="268" class="sans" font-size="17" fill="#8B9BB8">The Asyqa CRM is next.</text><text x="900" y="294" class="sans" font-size="17" fill="#8B9BB8">This is the fun part.</text></g>
<rect x=".5" y=".5" width="1199" height="389" rx="19.5" stroke="#FFFFFF" stroke-opacity=".08"/>
</svg>
